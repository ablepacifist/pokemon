# Layered env: module's own .env (lowest) < monorepo root .env (relative
# walk-up) < the root .env at $MASTER_ENV_FILE (highest of the files) < real
# OS environment variables (always win). Every entry is optional: a module
# cloned standalone with none of these files present still starts, using the
# ${KEY:default} fallbacks below.
spring.config.import=optional:file:./.env[.properties],optional:file:../../../.env[.properties],optional:file:${MASTER_ENV_FILE:./.env}[.properties]

server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${POKEMON_PORT:8090}

database.url=${DATABASE_URL:jdbc:hsqldb:hsql://localhost:9002/mydb}

# Sprite folders. Relative defaults resolve against the process working
# directory: true when this module sits at pokemon/pokemon/pokemonServer
# inside a full monorepo checkout and is launched from that directory (e.g.
# `gradlew bootRun`, or `java -jar` run from within pokemonServer). When
# launched by restart-all.ps1 from an unspecified working directory, the root
# .env (via MASTER_ENV_FILE) supplies an absolute path instead and overrides
# this default entirely.
pokemon.sprites.path=${POKEMON_SPRITES_PATH:../../pogo_assets/Images/Pokemon}
pokemon.item-sprites.path=${POKEMON_ITEM_SPRITES_PATH:../../pogo_assets/Images/Items}
pokemon.item-sprites.fallback=${POKEMON_ITEM_SPRITES_FALLBACK:../../moreAssets/pokesprite/items}

# CORS: exact origins + wildcard patterns, mirroring the root .env.example
# (dead 192.168.4.*/192.168.*:* entries dropped). SecurityConfig also always
# appends http://<cors.lan-host>:* and http://<cors.playit-host>:* patterns
# when those are set.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://alex-dyakin.com}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.alex-dyakin.com,http://*.playit.pub:*,http://*.with.playit.plus:*,http://*.gl.at.ply.gg:*,http://localhost:*,capacitor://localhost,https://localhost}
cors.lan-host=${LAN_HOST:192.168.1.4}
cors.playit-host=${PLAYIT_HOST:209.25.140.16}

# LexiconServer internal port, for SSO token validation at http://127.0.0.1:<port>
lexicon.port=${LEXICON_PORT:36568}

spring.mvc.pathmatch.use-suffix-pattern=false
